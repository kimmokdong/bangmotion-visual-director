<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>법이 만들어지는 과정</title>
  
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f4ecdc}body{display:grid;place-items:center}svg{display:block;width:min(100cqw,177.777778cqh);height:min(100cqh,56.25cqw)}text{font-family:Pretendard,Malgun Gothic,Apple SD Gothic Neo,system-ui,sans-serif}

body:has(> #bmvd-shell) {
  display: block !important;
  width: 100% !important;
  height: 100dvh !important;
  margin: 0 !important;
  overflow: hidden !important;
}
#bmvd-shell {
  position: relative;
  display: grid;
  grid-template: minmax(0, 1fr) auto / minmax(0, 1fr);
  width: 100%;
  height: 100%;
}
#bmvd-viewport {
  display: grid;
  place-items: center;
  container-type: size;
  min-height: 0;
  overflow: hidden;
}
#bmvd-stage {
  position: relative;
  display: grid;
  place-items: center;
  width: min(100cqw, calc(100cqh * var(--bmvd-aspect)));
  aspect-ratio: var(--bmvd-aspect);
  container-type: size;
  contain: layout paint;
  overflow: hidden;
}
html[data-bmvd-presenting] #bmvd-controls { display: none; }
html[data-bmvd-presenting] #bmvd-viewport { background: #000; }
html[data-bmvd-presenting] #bmvd-stage { background-color: var(--bmvd-stage-background); }
html[data-bmvd-presenting]:not([data-bmvd-cursor]),
html[data-bmvd-presenting]:not([data-bmvd-cursor]) #bmvd-shell * { cursor: none !important; }
#bmvd-controls {
  position: relative;
  box-sizing: border-box;
  width: 100%;
  max-height: 45dvh;
  padding: 8px max(16px, calc((100% - 1140px) / 2)) 10px;
  overflow: auto;
  border-top: 1px solid #3a4057;
  background: #1d2032;
  color: #eef0fa;
  color-scheme: dark;
  font: 500 14px/1.4 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
#bmvd-controls [hidden] { display: none !important; }
#bmvd-controls .bmvd-timeline, #bmvd-controls .bmvd-actions, #bmvd-scenes {
  display: flex;
  align-items: center;
  gap: 8px;
}
#bmvd-controls .bmvd-actions, #bmvd-scenes { flex-wrap: wrap; }
#bmvd-controls .bmvd-track { position: relative; flex: 1; min-width: 0; height: 28px; }
#bmvd-segments {
  position: absolute;
  inset: 9px 6px;
  overflow: hidden;
  border-radius: 4px;
  background: #3a4057;
}
#bmvd-segments span { position: absolute; height: 100%; background: #6874b0; box-shadow: inset -2px 0 #1d2032; }
#bmvd-segments span:nth-child(even) { background: #917dad; }
#bmvd-range { position: absolute; inset: 0; width: 100%; margin: 0; appearance: none; background: transparent; cursor: pointer; }
#bmvd-range::-webkit-slider-thumb { appearance: none; width: 14px; height: 20px; border-radius: 4px; background: #e1daff; }
#bmvd-range::-moz-range-thumb { width: 14px; height: 20px; border: 0; border-radius: 4px; background: #e1daff; }
#bmvd-time { min-width: 128px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
#bmvd-controls button, #bmvd-speed {
  min-height: 34px;
  padding: 4px 10px;
  border: 1px solid #565e7e;
  border-radius: 7px;
  background: #2b3048;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
#bmvd-controls button:hover, #bmvd-speed:hover { background: #3a405c; }
#bmvd-controls :focus-visible { outline: 2px solid #e1daff; outline-offset: 2px; }
#bmvd-controls button:disabled { opacity: .55; cursor: default; }
#bmvd-controls #bmvd-play { min-width: 76px; background: #dcdaff; color: #1d2032; }
#bmvd-controls #bmvd-record { color: #ffd0d6; }
#bmvd-controls label { display: inline-flex; gap: 4px; align-items: center; }
#bmvd-copy { margin-left: auto; }
#bmvd-scenes:not(:empty) { margin-top: 7px; }
#bmvd-scenes button[aria-current="true"] { border-color: #c9bbff; background: #47416d; }
#bmvd-note { margin: 7px 0 0; color: #cecee2; }
#bmvd-controls textarea { position: fixed; top: 0; left: -10000px; }
#bmvd-toast:not(:empty) {
  position: absolute;
  top: 4px;
  inset-inline: 8px;
  width: fit-content;
  max-width: calc(100% - 40px);
  margin-inline: auto;
  padding: 5px 12px;
  border-radius: 6px;
  background: #e1daff;
  color: #15162a;
  pointer-events: none;
}
</style>

    <title id="t">법이 만들어지는 과정</title>
    <desc id="d">법률안이 국회에 제출되어 상임위원회 심사와 본회의 의결을 거치고, 대통령이 공포하면 법이 되는 과정을 15초 플랫 벡터 애니메이션으로 보여 줍니다.</desc>
  </svg>

<script>window.__bmvdConfig = {"fps":30,"scenes":[{"id":"intro","label":"도입","start":0,"end":2},{"id":"submit","label":"① 법률안 제출","start":2,"end":4.5},{"id":"committee","label":"② 상임위원회 심사","start":4.5,"end":7},{"id":"plenary","label":"③ 본회의 의결","start":7,"end":9.5},{"id":"promulgate","label":"④ 대통령 공포","start":9.5,"end":12},{"id":"summary","label":"정리","start":12,"end":15}],"missingScenes":false,"projectName":"모션-작업폴더"};
(() => {
  const el = name => document.getElementById('bmvd-' + name);
  const { fps, scenes, missingScenes, projectName, webAudio } = window.__bmvdConfig;
  const root = document.documentElement;
  const stage = el('stage');
  const range = el('range');
  const time = el('time');
  const play = el('play');
  const loop = el('loop');
  const speed = el('speed');
  const sound = el('sound');
  const audio = el('audio');
  const copy = el('copy');
  const toast = el('toast');
  const present = el('present');
  const record = el('record');
  const recordLabel = record.textContent;
  const audioContext = webAudio && window.AudioContext ? new AudioContext() : null;
  const master = audioContext?.createGain();
  master?.connect(audioContext.destination);
  const sources = new Set();
  let buffers;
  let audioAnchor;
  let scheduledSources = 0;
  const audioLoading = audioContext && Promise.all(webAudio.assets.map(async src => {
    try {
      const data = await (await fetch(src)).arrayBuffer();
      return await audioContext.decodeAudioData(data);
    } catch (error) {
      console.warn('내장 소리를 읽을 수 없습니다.', error);
      return null;
    }
  })).then(decoded => {
    buffers = decoded;
    if (!buffers.some(Boolean)) sound.hidden = true;
    if (clock) syncAudio(true);
  });
  const reloadState = new URLSearchParams(location.hash.slice(1));
  const audioVersion = reloadState.get('audio');
  if (audioVersion && audio.getAttribute('src') === './out/sound/mix.wav') {
    audio.src = './out/sound/mix.wav?v=' + encodeURIComponent(audioVersion);
  }

  let clock;
  let availableScenes;
  let activeScene;
  let selectedScene;
  let sceneButtons;
  let pendingAudio;
  let audioBlocked = false;
  let toastTimer;
  let previousTime;
  let cursorTimer;
  let capture;

  window.__bmvdViewport = {
    get width() { return stage.clientWidth; },
    get height() { return stage.clientHeight; },
  };
  window.__bmvdPreview = { update };
  new ResizeObserver(() => window.dispatchEvent(new Event('resize'))).observe(stage);

  function setLoop() {
    clock.setLoop(loop.checked && !capture?.recorder ? selectedScene || { start: 0, end: clock.duration } : undefined);
  }

  function syncWebAudio(force) {
    if (!buffers || audioContext.state !== 'running') return;
    const now = audioContext.currentTime;
    const t = clock.time;
    const rate = Number(speed.value);
    if (!force && audioAnchor && clock.playing &&
        Math.abs(t - audioAnchor.time - (now - audioAnchor.context) * rate) <= 0.12) return;
    if (!audioAnchor && !clock.playing) return;
    for (const source of sources) source.stop();
    sources.clear();
    audioAnchor = undefined;
    if (!clock.playing) return;

    audioAnchor = { time: t, context: now };
    const loopEnd = loop.checked && !capture?.recorder ? selectedScene?.end ?? clock.duration : clock.duration;
    for (const track of webAudio.tracks) {
      const buffer = buffers[track.asset];
      if (!buffer?.duration) continue;
      const length = track.loop ? track.end - track.start
        : Math.min(track.trim ?? buffer.duration, buffer.duration);
      const start = Math.max(t, track.start);
      const end = Math.min(track.start + length, track.end, loopEnd);
      if (start >= end) continue;

      const when = now + (start - t) / rate;
      const until = now + (end - t) / rate;
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.playbackRate.value = rate;
      source.loop = !!track.loop;
      const gain = audioContext.createGain();
      gain.gain.value = 10 ** (track.gain / 20);
      source.connect(gain);
      let output = gain;

      function applyFade(from, to, fadeStart, fadeEnd) {
        if (fadeStart >= fadeEnd) return;
        const fade = audioContext.createGain();
        output.connect(fade);
        output = fade;
        const valueAt = time => from + (to - from) * Math.min(1, Math.max(0, (time - fadeStart) / (fadeEnd - fadeStart)));
        fade.gain.setValueAtTime(valueAt(start), when);
        if (start < fadeEnd && end > fadeStart) {
          const rampStart = Math.max(start, fadeStart);
          const rampEnd = Math.min(end, fadeEnd);
          fade.gain.setValueAtTime(valueAt(rampStart), now + (rampStart - t) / rate);
          fade.gain.linearRampToValueAtTime(valueAt(rampEnd), now + (rampEnd - t) / rate);
        }
      }
      const fadeIn = Math.min(track.fadeIn ?? 0, length);
      const fadeOut = Math.min(track.fadeOut ?? (track.trim ? Math.min(0.25, length * 0.3) : 0), length);
      applyFade(0, 1, track.start, track.start + fadeIn);
      applyFade(1, 0, track.start + length - fadeOut, track.start + length);
      output.connect(master);
      const offset = (track.offset ?? 0) + start - track.start;
      source.start(when, track.loop ? offset % buffer.duration : offset);
      source.stop(until);
      sources.add(source);
      source.onended = () => sources.delete(source);
      scheduledSources++;
    }
    root.dataset.bmvdAudioScheduled = scheduledSources;
  }

  function syncAudio(force = false) {
    if (audioContext) {
      syncWebAudio(force);
      return;
    }
    if (audio.error || !Number.isFinite(audio.duration)) return;
    const t = Math.min(clock.time, audio.duration);
    if (force || Math.abs(audio.currentTime - t) > 0.12) audio.currentTime = t;
    if (!clock.playing || t >= audio.duration) {
      if (!audio.paused) audio.pause();
    } else if (audio.paused && !pendingAudio && !audioBlocked) {
      pendingAudio = audio.play().catch(error => {
        if (error.name === 'NotAllowedError') audioBlocked = true;
      }).finally(() => { pendingAudio = undefined; });
    }
  }

  function seek(t, resume = false) {
    if (selectedScene && (t < selectedScene.start || t >= selectedScene.end)) {
      selectedScene = undefined;
      setLoop();
    }
    clock.seek(t);
    if (resume) clock.play();
    previousTime = clock.time;
    syncAudio(true);
    update();
  }

  function jumpToScene(i) {
    selectedScene = availableScenes[i];
    loop.checked = true;
    setLoop();
    seek(selectedScene.start, true);
  }

  function setup() {
    clock = window.__demo;
    range.max = clock.duration;
    range.disabled = play.disabled = present.disabled = record.disabled = false;
    availableScenes = scenes.filter(scene => scene.start < clock.duration)
      .map(scene => ({ ...scene, end: Math.min(scene.end, clock.duration) }));
    sceneButtons = availableScenes.map((scene, i) => {
      const segment = document.createElement('span');
      segment.style.left = 100 * scene.start / clock.duration + '%';
      segment.style.width = 100 * (scene.end - scene.start) / clock.duration + '%';
      el('segments').append(segment);

      const chip = document.createElement('button');
      chip.type = 'button';
      chip.textContent = (i + 1) + '. ' + scene.label;
      chip.title = scene.start + '–' + scene.end + '초' + (i < 9 ? ' (' + (i + 1) + ')' : '');
      chip.addEventListener('click', () => jumpToScene(i));
      el('scenes').append(chip);
      return chip;
    });
    if (missingScenes) {
      el('note').textContent = 'scenes.json 이 없어 장면 버튼을 만들지 않았습니다';
      el('note').hidden = false;
    }
    const restored = Number(reloadState.get('t'));
    if (reloadState.has('t') && Number.isFinite(restored)) clock.seek(restored);
    sound.hidden = audioContext ? !!buffers && !buffers.some(Boolean) : !audio.hasAttribute('src') || !!audio.error;
    if (audioContext) sound.title += ' · 음량 측정 없이 대략 맞춘 소리 (ffmpeg 없음)';
    syncAudio(true);
  }

  function update() {
    if (!clock) setup();
    const t = clock.time;
    const stamp = t.toFixed(2) + '초 · ' + Math.floor(t * fps) + '프레임';
    if (time.value !== stamp) {
      time.value = stamp;
      range.setAttribute('aria-valuetext', stamp);
    }
    range.value = t;
    const caption = clock.playing ? 'Ⅱ 정지' : '▶ 재생';
    if (play.textContent !== caption) play.textContent = caption;
    const i = availableScenes.findIndex(scene => t >= scene.start && t < scene.end);
    if (i !== activeScene) {
      sceneButtons[activeScene]?.removeAttribute('aria-current');
      sceneButtons[i]?.setAttribute('aria-current', 'true');
      activeScene = i;
    }
