<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F1EA">
  <link rel="icon" href="data:,">
  <title>띠그래프로 나타내기</title>
  
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f4f1ea}body{display:grid;place-items:center}svg{display:block;width:min(100cqw,177.777778cqh);height:min(100cqh,56.25cqw)}

body:has(> #bmvd-shell) {
  display: block !important;
  width: 100% !important;
  height: 100dvh !important;
  margin: 0 !important;
  overflow: hidden !important;
}
#bmvd-shell {
  position: relative;
  display: grid;
  grid-template: minmax(0, 1fr) auto / minmax(0, 1fr);
  width: 100%;
  height: 100%;
}
#bmvd-viewport {
  display: grid;
  place-items: center;
  container-type: size;
  min-height: 0;
  overflow: hidden;
}
#bmvd-stage {
  position: relative;
  display: grid;
  place-items: center;
  width: min(100cqw, calc(100cqh * var(--bmvd-aspect)));
  aspect-ratio: var(--bmvd-aspect);
  container-type: size;
  contain: layout paint;
  overflow: hidden;
}
html[data-bmvd-presenting] #bmvd-controls { display: none; }
html[data-bmvd-presenting] #bmvd-viewport { background: #000; }
html[data-bmvd-presenting] #bmvd-stage { background-color: var(--bmvd-stage-background); }
html[data-bmvd-presenting]:not([data-bmvd-cursor]),
html[data-bmvd-presenting]:not([data-bmvd-cursor]) #bmvd-shell * { cursor: none !important; }
#bmvd-controls {
  position: relative;
  box-sizing: border-box;
  width: 100%;
  max-height: 45dvh;
  padding: 8px max(16px, calc((100% - 1140px) / 2)) 10px;
  overflow: auto;
  border-top: 1px solid #3a4057;
  background: #1d2032;
  color: #eef0fa;
  color-scheme: dark;
  font: 500 14px/1.4 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
#bmvd-controls [hidden] { display: none !important; }
#bmvd-controls .bmvd-timeline, #bmvd-controls .bmvd-actions, #bmvd-scenes {
  display: flex;
  align-items: center;
  gap: 8px;
}
#bmvd-controls .bmvd-actions, #bmvd-scenes { flex-wrap: wrap; }
#bmvd-controls .bmvd-track { position: relative; flex: 1; min-width: 0; height: 28px; }
#bmvd-segments {
  position: absolute;
  inset: 9px 6px;
  overflow: hidden;
  border-radius: 4px;
  background: #3a4057;
}
#bmvd-segments span { position: absolute; height: 100%; background: #6874b0; box-shadow: inset -2px 0 #1d2032; }
#bmvd-segments span:nth-child(even) { background: #917dad; }
#bmvd-range { position: absolute; inset: 0; width: 100%; margin: 0; appearance: none; background: transparent; cursor: pointer; }
#bmvd-range::-webkit-slider-thumb { appearance: none; width: 14px; height: 20px; border-radius: 4px; background: #e1daff; }
#bmvd-range::-moz-range-thumb { width: 14px; height: 20px; border: 0; border-radius: 4px; background: #e1daff; }
#bmvd-time { min-width: 128px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
#bmvd-controls button, #bmvd-speed {
  min-height: 34px;
  padding: 4px 10px;
  border: 1px solid #565e7e;
  border-radius: 7px;
  background: #2b3048;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
#bmvd-controls button:hover, #bmvd-speed:hover { background: #3a405c; }
#bmvd-controls :focus-visible { outline: 2px solid #e1daff; outline-offset: 2px; }
#bmvd-controls button:disabled { opacity: .55; cursor: default; }
#bmvd-controls #bmvd-play { min-width: 76px; background: #dcdaff; color: #1d2032; }
#bmvd-controls #bmvd-record { color: #ffd0d6; }
#bmvd-controls label { display: inline-flex; gap: 4px; align-items: center; }
#bmvd-copy { margin-left: auto; }
#bmvd-scenes:not(:empty) { margin-top: 7px; }
#bmvd-scenes button[aria-current="true"] { border-color: #c9bbff; background: #47416d; }
#bmvd-note { margin: 7px 0 0; color: #cecee2; }
#bmvd-controls textarea { position: fixed; top: 0; left: -10000px; }
#bmvd-toast:not(:empty) {
  position: absolute;
  top: 4px;
  inset-inline: 8px;
  width: fit-content;
  max-width: calc(100% - 40px);
  margin-inline: auto;
  padding: 5px 12px;
  border-radius: 6px;
  background: #e1daff;
  color: #15162a;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="bmvd-shell" style="--bmvd-aspect:1.7777777777777777"><div id="bmvd-viewport"><div id="bmvd-stage">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="scene-title scene-description">
    <title id="scene-title">띠그래프로 나타내기</title>
    <desc id="scene-description">우리 반 25명이 좋아하는 계절(봄 8명, 여름 6명, 가을 7명, 겨울 4명)을 백분율 32%, 24%, 28%, 16%로 바꾸고, 전체 길이를 100%로 하는 띠를 그 비율만큼 나누어 띠그래프를 만드는 43초 설명 영상.</desc>
  </svg>
  
</div></div>
<section id="bmvd-controls" aria-label="영상 재생 조작">
  <div class="bmvd-timeline"><div class="bmvd-track">
    <div id="bmvd-segments" aria-hidden="true"></div>
    <input id="bmvd-range" type="range" aria-label="재생 위치" min="0" max="0" step="any" value="0" disabled>
  </div><output id="bmvd-time" for="bmvd-range" aria-live="off">0.00초 · 0프레임</output></div>
  <div class="bmvd-actions">
    <button type="button" id="bmvd-play" title="재생 / 일시정지 (Space)" disabled>▶ 재생</button>
    <button type="button" id="bmvd-back" aria-label="한 프레임 뒤로" title="한 프레임 뒤로 (←)">◀</button>
    <button type="button" id="bmvd-next" aria-label="한 프레임 앞으로" title="한 프레임 앞으로 (→)">▶</button>
    <select id="bmvd-speed" aria-label="재생 속도">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
    </select>
    <label><input id="bmvd-loop" type="checkbox"> 반복</label>
    <button type="button" id="bmvd-sound" title="소리 켜기 / 끄기 (M)" aria-pressed="true" hidden>🔊 소리</button>
    <button type="button" id="bmvd-present" aria-label="상영 (F)" title="전체화면 상영 (F)" disabled>⛶ 상영</button>
    <button type="button" id="bmvd-record" disabled>● 영상으로 저장</button>
    <button type="button" id="bmvd-copy" title="지금 시각 복사 (C)">📋 지금 시각 복사</button>
    <button type="button" id="bmvd-reload" title="현재 시각에서 다시 읽기 (R)">↻ 다시 읽기</button>
  </div>
  <div id="bmvd-scenes" role="group" aria-label="장면별 재생"></div>
